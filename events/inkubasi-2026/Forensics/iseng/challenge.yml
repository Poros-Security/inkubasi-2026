# yaml-language-server: $schema=https://raw.githubusercontent.com/dimasma0305/gzcli/refs/heads/main/internal/template/templates/others/ctf-template/.gzctf/challenge.schema.yaml

name: "Iseng"
author: "broKen"

description: |
  Intinya analisis traffic dan pahami TCP/IP Layer.

  Beberapa soal memang membutuhkan penyimpulan kognitif dari peserta dan tidak
  semua ada dalam PCAP.

type: "StaticContainer"
value: 1000
visible: false   # ubah ke true saat kompetisi dimulai

flags:
  - "PorosCTF{S3puH_BlU3_T34m_d4n_N3tw0rk_4n4lys1s_Harus_Join_ICN_Sih_Ini_ditunggu_yah_tahun_ini}"

container:
  containerImage: "iseng:latest"
  memoryLimit: 256
  cpuCount: 1
  storageLimit: 512
  exposePort: 6767
  enableTrafficCapture: false

scripts:
  start: cd src && docker build -t {{.slug}} .
